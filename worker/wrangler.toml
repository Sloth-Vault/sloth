name = "sloth-site"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true
routes = [
  { pattern = "slothvault.xyz", custom_domain = true },
  { pattern = "www.slothvault.xyz", custom_domain = true },
]

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/rpc"]
